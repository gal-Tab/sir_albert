<!DOCTYPE html>
<!-- scroll-film template · one illustrated image, a camera that travels object to object as you scroll.
     You normally edit ONLY story.js (theme + copy + object positions). engine.js is the shared engine.
     Motion (motion.dev) drives the camera springs, chapter detection, scroll-linked progress, entrances and the reveal. -->
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Explainer</title>
<script src="https://cdn.jsdelivr.net/npm/motion@14.7.1/dist/motion.js"></script>
<script src="story.js"></script>
<style>
:root{
  --paper:#fff; --linen:#f9faf7; --ink:#171717; --graphite:#2c2c2c; --charcoal:#444141; --ash:#646464; --mist:#dee2de;
  --accent:#0081c0; --signal:#41a1cf; --highlight:#e9b44c; --wall:#f4f1e6; --tip-bg:#fff6d8; --tip-line:#ecd9a0;
  --serif:Georgia,serif; --sans:-apple-system,'Segoe UI',sans-serif;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;font:400 18px/1.55 var(--sans);color:var(--charcoal);background:var(--wall);-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:var(--serif);font-weight:400;letter-spacing:-.02em;color:var(--graphite);line-height:1.08;margin:0}
a{color:inherit}
:focus-visible{outline:2px solid var(--signal);outline-offset:3px;border-radius:6px}
.label{font-size:12.5px;letter-spacing:.08em;text-transform:uppercase;font-weight:600;color:var(--ash)}

/* progress + dots (physical right edge in both directions) */
#bar{position:fixed;left:0;top:0;height:4px;width:100%;background:var(--accent);transform-origin:0 50%;transform:scaleX(0);z-index:60}
.rtl #bar{transform-origin:100% 50%}
#dots{position:fixed;right:18px;top:50%;transform:translateY(-50%);z-index:55;display:flex;flex-direction:column;gap:12px;direction:ltr}
#dots button{width:14px;height:14px;border-radius:50%;border:2px solid var(--ink);background:var(--paper);padding:0;cursor:pointer;position:relative}
#dots button[aria-current="true"]{background:var(--ink)}
#dots button span{position:absolute;right:26px;top:50%;transform:translateY(-50%);white-space:nowrap;font-size:13px;font-weight:600;background:var(--ink);color:#fff;padding:3px 10px;border-radius:99px;opacity:0;pointer-events:none;transition:opacity .15s;direction:auto}
#dots button:hover span,#dots button:focus-visible span{opacity:1}

/* the stage */
.story{position:relative}
.scene{position:sticky;top:0;height:100vh;overflow:hidden;z-index:0;background:var(--wall);direction:ltr}
.bg{position:absolute;inset:-6%;width:112%;height:112%;object-fit:cover;filter:blur(28px) brightness(.92);pointer-events:none}
.cam{position:absolute;left:0;top:0;transform-origin:0 0;will-change:transform}
.cam>img.hero-img{position:absolute;inset:0;width:100%;height:100%;display:block;user-select:none;-webkit-user-drag:none}
.dim{position:absolute;inset:0;background:var(--wall);opacity:0;pointer-events:none}
@property --vx{syntax:'<percentage>';inherits:false;initial-value:50%}
@property --vy{syntax:'<percentage>';inherits:false;initial-value:45%}
.vig{position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse 55% 60% at var(--vx) var(--vy),transparent 45%,rgba(40,25,10,.30));transition:--vx .9s ease,--vy .9s ease}

#fx{position:absolute;inset:0;pointer-events:none;container-type:size}
/* hotspots live inside the camera and counter-scale so labels stay readable */
.spot{position:absolute;transform:translate(-50%,-50%) scale(var(--inv,1));z-index:2;transition:opacity .5s}
.pill{display:inline-flex;align-items:center;gap:8px;white-space:nowrap;cursor:pointer;border:2.5px solid var(--ink);background:var(--paper);color:var(--ink);
  font:600 15px/1 var(--sans);padding:9px 14px 9px 9px;border-radius:99px;box-shadow:3px 3px 0 var(--ink);opacity:0}
.rtl .pill{padding:9px 9px 9px 14px;direction:rtl}
.pill b{display:grid;place-items:center;width:24px;height:24px;border-radius:50%;background:var(--ink);color:#fff;font:600 13px var(--sans)}
.spot.on .pill{background:var(--highlight)}
.bubble-wrap{position:absolute;transform:translate(-50%,-100%) scale(var(--inv,1));transform-origin:50% 100%;z-index:3}
.bubble{position:relative;background:var(--paper);border:2.5px solid var(--ink);border-radius:16px;padding:10px 14px;font:500 15px/1.35 var(--sans);color:var(--ink);width:220px;opacity:0;box-shadow:3px 3px 0 var(--ink)}
.rtl .bubble{direction:rtl}
.bubble::after{content:"";position:absolute;left:50%;bottom:-11px;width:16px;height:16px;background:var(--paper);border-right:2.5px solid var(--ink);border-bottom:2.5px solid var(--ink);transform:translateX(-50%) rotate(45deg)}

/* chapters sit on top of the sticky stage; they stay physical (ltr) so a card sits on the side opposite its object,
   and only the text inside the boxes flips for RTL */
.chapters{position:relative;z-index:5;margin-top:-100vh;pointer-events:none;direction:ltr}
.ch{min-height:100vh;display:flex;align-items:center;padding:0 clamp(20px,6vw,90px)}
.ch.right{justify-content:flex-end}
.ch.tall{min-height:310vh;align-items:flex-start;flex-direction:column;justify-content:flex-start}
.ch.tall .tall-intro{min-height:100vh;display:flex;align-items:center;width:100%;justify-content:flex-start}
.ch.right.tall .tall-intro{justify-content:flex-end}
.card{pointer-events:auto;width:min(480px,100%);background:var(--paper);border:2.5px solid var(--ink);border-radius:22px;padding:28px 28px 24px;box-shadow:7px 7px 0 var(--ink);position:relative;opacity:0}
.rtl .card,.rtl .lens-inner,.rtl .hero-card,.rtl .finale .card{direction:rtl}
.card::before{content:"";position:absolute;top:-13px;left:34px;width:84px;height:24px;background:var(--highlight);opacity:.9;transform:rotate(-3deg);border:2px solid var(--ink)}
.rtl .card::before{left:auto;right:34px;transform:rotate(3deg)}
.card .num{font:600 70px/1 var(--serif);color:var(--mist);position:absolute;right:20px;top:6px;pointer-events:none}
.rtl .card .num{right:auto;left:20px}
.card h2{font-size:clamp(30px,3.4vw,42px);margin:6px 0 12px}
.card p{margin:0 0 12px}
.card .why b,.card p b{color:var(--graphite);font-weight:600}
.todo{margin:16px 0 0;padding:14px 18px 14px 36px;background:var(--linen);border:1.5px solid var(--mist);border-radius:14px;font-size:16px}
.rtl .todo{padding:14px 36px 14px 18px}
.todo li{margin:3px 0}
.tip{background:var(--tip-bg);border:1.5px solid var(--tip-line);border-radius:12px;padding:8px 12px;font-size:15px;line-height:1.45;color:var(--graphite)}
.inlink{color:var(--accent);font-weight:600;text-decoration:underline;text-underline-offset:2px}
.todo-h{font:600 12.5px var(--sans);letter-spacing:.08em;text-transform:uppercase;color:var(--ash);margin:18px 0 -8px}
.refs{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
.chip{display:inline-flex;padding:3px 12px;border-radius:8px;border:1.5px solid var(--signal);color:var(--accent);font-size:14.5px;font-weight:500;text-decoration:none;background:var(--paper)}
a.chip:hover{background:var(--linen)}
.chip.tbd{border-style:dashed;border-color:var(--ash);color:var(--ash);font-style:italic}
.btn{display:inline-flex;align-items:center;gap:8px;padding:8px 14px;border-radius:10px;border:2px solid var(--ink);background:var(--paper);color:var(--ink);font:600 15px var(--sans);cursor:pointer;box-shadow:2px 2px 0 var(--ink);text-decoration:none}
.btn:active{transform:translate(2px,2px);box-shadow:none}
.btn.pri{background:var(--ink);color:#fff}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:14px}

/* blocks */
.srcs{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0 4px}
.src{display:inline-flex;gap:8px;align-items:center;border:1.5px solid var(--mist);background:var(--linen);border-radius:10px;padding:6px 12px;font-size:15px;font-weight:500;color:var(--graphite)}
.jobs{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:14px 0 8px}
.job{border:2px solid var(--ink);border-radius:10px;padding:9px 11px;background:var(--paper);cursor:default}
.job code{font:700 13px ui-monospace,Menlo,monospace;color:var(--ink)}
.job p{margin:3px 0 0;font-size:13.5px;line-height:1.35;color:var(--ash)}
.more{display:none;margin:10px 0 0;padding:0;list-style:none;flex-wrap:wrap;gap:6px}
.more.open{display:flex}
.more li code{font:600 12.5px ui-monospace,Menlo,monospace;border:1.5px dashed var(--ash);border-radius:6px;padding:2px 8px;color:var(--charcoal)}
.clockrows{list-style:none;margin:12px 0 0;padding:0}
.clockrows li{display:flex;gap:16px;padding:11px 0;border-top:1.5px solid var(--mist)}
.clockrows li:first-child{border-top:0}
.clockrows .t{font:600 30px/1 var(--serif);color:var(--graphite);width:86px;flex:none}
.clockrows b{display:block;color:var(--graphite);font-weight:600}
.clockrows span.d{font-size:15px;display:block;line-height:1.35}
.speech{font-size:13px;color:var(--ash)}
.badge{display:inline-block;margin-inline-start:8px;padding:1px 9px;border:1.5px dashed var(--ash);border-radius:99px;color:var(--ash);letter-spacing:.08em}
.pipe{list-style:none;margin:16px 0 0;padding:0;display:grid;gap:10px}
.pipe li{display:flex;align-items:center;gap:12px;border:2px dashed var(--ink);border-radius:12px;padding:10px 14px;background:var(--paper);font-weight:600;color:var(--graphite);position:relative}
.pipe li i{font-style:normal;font-size:24px}
.pipe li:not(:last-child)::after{content:"↓";position:absolute;left:24px;bottom:-22px;color:var(--ash);font-size:18px}
.rtl .pipe li:not(:last-child)::after{left:auto;right:24px}
.pipe li:not(:last-child){margin-bottom:12px}

/* hero + finale */
.ch.hero-ch{align-items:flex-end;justify-content:center;padding-bottom:max(12px,2vh)}
.hero-card{pointer-events:auto;width:min(920px,94vw);opacity:1;padding:18px 28px 18px;border-radius:20px;box-shadow:6px 6px 0 var(--ink);background:rgba(255,255,255,.94);backdrop-filter:blur(6px);display:flex;flex-direction:column;align-items:center;text-align:center}
.hero-card::before{display:none}
.hero-card h1{font-size:clamp(32px,4vw,58px);line-height:1.04;margin:0 0 8px}
.hero-card p{font-size:clamp(15px,1.25vw,18px);line-height:1.45;color:var(--charcoal);margin:0;max-width:760px}
.hero-stack{display:flex;flex-direction:column;align-items:center;gap:14px;width:100%}
.hero-bubble{pointer-events:auto;display:inline-block;background:var(--ink);color:#fff;border:2px solid var(--paper);border-radius:99px;padding:10px 26px;font-weight:600;font-size:15px;white-space:nowrap;box-shadow:0 4px 14px rgba(0,0,0,.25)}
.finale{min-height:120vh;display:grid;place-items:end center;padding:60px clamp(20px,6vw,90px)}
.finale .card{background:var(--accent);color:#fff;width:min(760px,100%);border-color:var(--ink);padding:40px}
.finale .card::before{background:var(--highlight)}
.finale h2{color:#fff;font-size:clamp(34px,4.6vw,56px);margin-bottom:22px}
.finale ol{font-size:21px;line-height:1.5;padding-inline-start:26px;margin:0 0 26px}
.finale ol li{margin:10px 0}
.finale ol b{font-weight:600}
.finale ol .inlink{color:#fff;text-decoration-thickness:2px}
.finale ol .inlink:hover{background:rgba(255,255,255,.14)}
.finale .lk{display:inline-flex;margin-inline-end:10px;padding:5px 14px;border:2px solid #fff;border-radius:10px;color:#fff;text-decoration:none;font-weight:600}
.finale .lk:hover{background:rgba(255,255,255,.14)}
.finale .lk.tbd{border-style:dashed;font-style:italic;opacity:.85}

/* lens: the before/after reveal. Sticky inside the tall chapter, faded by scroll progress */
.lens{visibility:hidden;position:sticky;top:0;height:100vh;width:100%;display:grid;place-items:center;pointer-events:none;opacity:0}
.lens-inner{width:min(880px,92vw,calc((100vh - 330px)*1.5));pointer-events:auto}
.lens-head{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;margin-bottom:14px;flex-wrap:wrap}
.lens-head h3{font-size:clamp(26px,3vw,38px)}
.lens-cols{display:grid;grid-template-columns:1fr 1.5fr;gap:22px;margin-top:18px;font-size:14.5px;line-height:1.45}
.lens-cols p{margin:0}
.lens-cols b{color:var(--ink)}
.lens-note{font-size:15px;color:var(--ash);margin:12px 0 0;text-align:center}
.reveal{position:relative;aspect-ratio:3/2;width:100%;border:3px solid var(--ink);border-radius:20px;overflow:hidden;background:var(--paper);box-shadow:8px 8px 0 var(--ink);touch-action:pan-y;cursor:ew-resize;user-select:none;-webkit-user-select:none;direction:ltr}
.reveal img{position:absolute;inset:0;width:100%;height:100%;display:block;object-fit:cover;pointer-events:none}
.rv-tag{position:absolute;bottom:16px;background:var(--ink);color:#fff;font:700 14px ui-monospace,Menlo,monospace;letter-spacing:.04em;text-transform:uppercase;padding:8px 16px;border-radius:99px;transition:opacity .2s;pointer-events:none}
.rv-b{left:16px;background:#8a5a35}.rv-a{right:16px;background:var(--accent)}
.rtl .rv-b{left:auto;right:16px}.rtl .rv-a{right:auto;left:16px}
.rv-handle{position:absolute;top:0;bottom:0;width:4px;margin-left:-2px;background:var(--ink);cursor:ew-resize;outline-offset:6px;opacity:calc(.25 + var(--edge,1)*.75)}
.rtl .rv-handle{margin-left:0;margin-right:-2px}
.rv-grip{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);display:grid;place-items:center;width:54px;height:54px;border-radius:50%;background:var(--highlight);border:3px solid var(--ink);box-shadow:3px 3px 0 var(--ink);font:700 18px var(--sans);color:var(--ink);letter-spacing:2px;white-space:nowrap}
.dragging .rv-grip{transform:translate(-50%,-50%) scale(1.12)}

/* RTL typography: no letter-spacing or forced caps on Hebrew/Arabic */
.rtl h1,.rtl h2,.rtl h3,.rtl .label,.rtl .todo-h,.rtl .badge{letter-spacing:0;text-transform:none}

@media (max-width:820px){
  /* phones: the card takes the bottom half and scrolls inside itself, so the object stays visible above it */
  .ch:not(.finale) .card:not(.hero-card){max-height:50vh;overflow:auto;overscroll-behavior:contain}
  .card::before{display:none}
  .bubble-wrap{display:none}
  .ch,.ch.right{justify-content:center;align-items:flex-end;padding-bottom:24px}
  .ch.tall .tall-intro,.ch.right.tall .tall-intro{justify-content:center;align-items:flex-end;padding-bottom:24px}
  .card{padding:22px 20px 18px;box-shadow:5px 5px 0 var(--ink)}
  .card .num{font-size:52px}
  #dots{display:none}
  .jobs{grid-template-columns:1fr}
}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}.vig{transition:none}}
</style>
</head>
<body>
<div id="bar" aria-hidden="true"></div>
<nav id="dots" aria-label="Chapters"></nav>

<main class="story" id="story">
  <div class="scene" id="scene">
    <img class="bg" id="bg" alt="" aria-hidden="true">
    <div class="cam" id="cam">
      <img class="hero-img" id="heroimg" alt="">
      <div id="fx"></div>
      <div id="spots"></div>
    </div>
    <div class="dim" id="lensdim"></div>
    <div class="dim" id="dim"></div>
    <div class="vig"></div>
  </div>
  <div class="chapters" id="chapters"></div>
</main>

<script src="engine.js"></script>
</body>
</html>
