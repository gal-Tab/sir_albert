<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Monday.com Chart Template</title>

  <!-- Google Fonts: Poppins -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">

  <!-- Chart.js CDN -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>

  <style>
    :root {
      /* Monday.com Brand Colors */
      --monday-purple: #6161FF;
      --monday-dark: #181B34;
      --monday-light: #F0F3FF;
      --monday-white: #FFFFFF;
      --monday-green: #00CA72;
      --monday-yellow: #FFCC00;
      --monday-red: #FB275D;

      /* Product Colors */
      --crm-turquoise: #00D2D2;
      --dev-green: #00CA72;
      --service-red: #FB275D;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Poppins', sans-serif;
      background: var(--monday-white);
      color: var(--monday-dark);
      padding: 40px 20px;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
    }

    h1 {
      font-size: 32px;
      font-weight: 700;
      margin-bottom: 32px;
      color: var(--monday-dark);
    }

    .chart-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(500px, 1fr));
      gap: 40px;
      margin-bottom: 40px;
    }

    .chart-container {
      background: var(--monday-white);
      border-radius: 12px;
      padding: 32px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
    }

    .chart-title {
      font-size: 20px;
      font-weight: 600;
      margin-bottom: 24px;
      color: var(--monday-dark);
    }

    canvas {
      max-width: 100%;
      height: auto !important;
    }

    @media (max-width: 768px) {
      .chart-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>Monday.com chart examples</h1>

    <div class="chart-grid">

      <!-- Bar Chart: Work Management (Purple) -->
      <div class="chart-container">
        <h2 class="chart-title">Project completion by team</h2>
        <canvas id="barChart"></canvas>
      </div>

      <!-- Line Chart: Multi-Product Status -->
      <div class="chart-container">
        <h2 class="chart-title">Task status over time</h2>
        <canvas id="lineChart"></canvas>
      </div>

      <!-- Pie Chart: Status Distribution -->
      <div class="chart-container">
        <h2 class="chart-title">Current project status</h2>
        <canvas id="pieChart"></canvas>
      </div>

      <!-- Doughnut Chart: CRM Pipeline -->
      <div class="chart-container">
        <h2 class="chart-title">Sales pipeline by stage</h2>
        <canvas id="doughnutChart"></canvas>
      </div>

    </div>
  </div>

  <script>
    // ===== MONDAY.COM COLOR SCHEMES =====

    const mondayColors = {
      // Primary brand colors
      purple: '#6161FF',
      dark: '#181B34',
      light: '#F0F3FF',
      white: '#FFFFFF',

      // Supportive colors (status)
      green: '#00CA72',
      yellow: '#FFCC00',
      red: '#FB275D',

      // Product colors
      crmTurquoise: '#00D2D2',
      devGreen: '#00CA72',
      serviceRed: '#FB275D',

      // Extended palette (lighter/darker variations)
      purpleLight: '#8C8CFF',
      greenLight: '#5AE3A5',
      yellowLight: '#FFE066',
      redLight: '#FF6B91',
    };

    // Default Chart.js configuration for Monday.com branding
    Chart.defaults.font.family = "'Poppins', sans-serif";
    Chart.defaults.font.size = 14;
    Chart.defaults.color = mondayColors.dark;

    // ===== BAR CHART (Work Management - Purple) =====
    const barCtx = document.getElementById('barChart').getContext('2d');
    const barChart = new Chart(barCtx, {
      type: 'bar',
      data: {
        labels: ['Design', 'Engineering', 'Marketing', 'Sales', 'Support'],
        datasets: [{
          label: 'Projects completed',
          data: [12, 19, 8, 15, 11],
          backgroundColor: mondayColors.purple,
          borderRadius: 6,
          borderSkipped: false,
        }]
      },
      options: {
        responsive: true,
        maintainAspectRatio: true,
        plugins: {
          legend: {
            display: false
          },
          tooltip: {
            backgroundColor: mondayColors.dark,
            padding: 12,
            cornerRadius: 8,
            titleFont: {
              size: 14,
              weight: '600'
            },
            bodyFont: {
              size: 14
            }
          }
        },
        scales: {
          y: {
            beginAtZero: true,
            grid: {
              color: 'rgba(0, 0, 0, 0.05)'
            },
            ticks: {
              font: {
                size: 12
              }
            }
          },
          x: {
            grid: {
              display: false
            },
            ticks: {
              font: {
                size: 12
              }
            }
          }
        }
      }
    });

    // ===== LINE CHART (Status Over Time - Green/Yellow/Red) =====
    const lineCtx = document.getElementById('lineChart').getContext('2d');
    const lineChart = new Chart(lineCtx, {
      type: 'line',
      data: {
        labels: ['Week 1', 'Week 2', 'Week 3', 'Week 4', 'Week 5', 'Week 6'],
        datasets: [
          {
            label: 'Done',
            data: [3, 7, 12, 18, 24, 32],
            borderColor: mondayColors.green,
            backgroundColor: mondayColors.green + '20', // 20% opacity
            tension: 0.4,
            borderWidth: 3,
            pointRadius: 4,
            pointBackgroundColor: mondayColors.green,
            pointBorderColor: '#fff',
            pointBorderWidth: 2,
            fill: true
          },
          {
            label: 'Working on it',
            data: [8, 11, 9, 12, 10, 8],
            borderColor: mondayColors.yellow,
            backgroundColor: mondayColors.yellow + '20',
            tension: 0.4,
            borderWidth: 3,
            pointRadius: 4,
            pointBackgroundColor: mondayColors.yellow,
            pointBorderColor: '#fff',
            pointBorderWidth: 2,
            fill: true
          },
          {
            label: 'Stuck',
            data: [5, 4, 6, 3, 2, 1],
            borderColor: mondayColors.red,
            backgroundColor: mondayColors.red + '20',
            tension: 0.4,
            borderWidth: 3,
            pointRadius: 4,
            pointBackgroundColor: mondayColors.red,
            pointBorderColor: '#fff',
            pointBorderWidth: 2,
            fill: true
          }
        ]
      },
      options: {
        responsive: true,
        maintainAspectRatio: true,
        plugins: {
          legend: {
            position: 'top',
            labels: {
              usePointStyle: true,
              padding: 20,
              font: {
                size: 14,
                weight: '600'
              }
            }
          },
          tooltip: {
            backgroundColor: mondayColors.dark,
            padding: 12,
            cornerRadius: 8
          }
        },
        scales: {
          y: {
            beginAtZero: true,
            grid: {
              color: 'rgba(0, 0, 0, 0.05)'
            }
          },
          x: {
            grid: {
              display: false
            }
          }
        }
      }
    });

    // ===== PIE CHART (Status Distribution) =====
    const pieCtx = document.getElementById('pieChart').getContext('2d');
    const pieChart = new Chart(pieCtx, {
      type: 'pie',
      data: {
        labels: ['Done', 'Working on it', 'Stuck', 'Not started'],
        datasets: [{
          data: [45, 30, 10, 15],
          backgroundColor: [
            mondayColors.green,
            mondayColors.yellow,
            mondayColors.red,
            mondayColors.light
          ],
          borderWidth: 3,
          borderColor: '#fff'
        }]
      },
      options: {
        responsive: true,
        maintainAspectRatio: true,
        plugins: {
          legend: {
            position: 'right',
            labels: {
              usePointStyle: true,
              padding: 15,
              font: {
                size: 14,
                weight: '600'
              }
            }
          },
          tooltip: {
            backgroundColor: mondayColors.dark,
            padding: 12,
            cornerRadius: 8,
            callbacks: {
              label: function(context) {
                const label = context.label || '';
                const value = context.parsed || 0;
                const total = context.dataset.data.reduce((a, b) => a + b, 0);
                const percentage = Math.round((value / total) * 100);
                return `${label}: ${value} (${percentage}%)`;
              }
            }
          }
        }
      }
    });

    // ===== DOUGHNUT CHART (CRM Pipeline - Turquoise accent) =====
    const doughnutCtx = document.getElementById('doughnutChart').getContext('2d');
    const doughnutChart = new Chart(doughnutCtx, {
      type: 'doughnut',
      data: {
        labels: ['Qualified', 'Proposal', 'Negotiation', 'Closed won', 'Closed lost'],
        datasets: [{
          data: [25, 18, 12, 30, 15],
          backgroundColor: [
            mondayColors.crmTurquoise,
            mondayColors.purple,
            mondayColors.yellow,
            mondayColors.green,
            mondayColors.red
          ],
          borderWidth: 3,
          borderColor: '#fff'
        }]
      },
      options: {
        responsive: true,
        maintainAspectRatio: true,
        cutout: '60%', // Doughnut hole size
        plugins: {
          legend: {
            position: 'right',
            labels: {
              usePointStyle: true,
              padding: 15,
              font: {
                size: 14,
                weight: '600'
              }
            }
          },
          tooltip: {
            backgroundColor: mondayColors.dark,
            padding: 12,
            cornerRadius: 8,
            callbacks: {
              label: function(context) {
                const label = context.label || '';
                const value = context.parsed || 0;
                const total = context.dataset.data.reduce((a, b) => a + b, 0);
                const percentage = Math.round((value / total) * 100);
                return `${label}: ${value} deals (${percentage}%)`;
              }
            }
          }
        }
      }
    });
  </script>

  <!-- ===== MONDAY.COM CHART GUIDELINES ===== -->
  <!--
    COLOR USAGE BY CHART TYPE:

    BAR CHARTS:
    - Single series: Use Monday Purple (or product color)
    - Multi-series: Use purple + supportive colors (green, yellow, red)
    - Comparison: Use product color vs. light gray

    LINE CHARTS:
    - Status-based: Use green (done), yellow (working), red (stuck)
    - Trends: Use purple for main metric, turquoise for secondary
    - Multi-product: Each product gets its own color

    PIE/DOUGHNUT CHARTS:
    - Status: Green, yellow, red, light purple
    - Categories: Use all brand colors (purple, turquoise, green, red)
    - Limit to 5-6 slices maximum for clarity

    ACCESSIBILITY:
    - All charts readable by colorblind users (use patterns if needed)
    - Tooltips for detailed data on hover
    - Legends positioned for easy reading
    - Minimum font size 12px

    CUSTOMIZATION FOR PRODUCTS:
    - Work Management: Purple primary
    - CRM: Turquoise primary, purple secondary
    - dev: Green primary, purple accent
    - service: Red primary, yellow secondary

    CHART BEST PRACTICES:
    - Clean axes, no unnecessary gridlines
    - Large, legible labels (14px minimum)
    - Tooltips with dark background (Monday Dark)
    - Rounded corners (6-8px) on bars
    - Smooth curves (tension: 0.4) on lines
    - White borders (3px) between pie slices
    - Responsive sizing for mobile

    TO USE THIS TEMPLATE:
    1. Replace data with your actual values
    2. Adjust colors based on product context
    3. Update chart titles (sentence case, no period)
    4. Customize tooltips if needed
    5. Ensure all text is readable (AA contrast minimum)
  -->

</body>
</html>
